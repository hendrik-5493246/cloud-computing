apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:19rc1-alpine
          ports:
            - containerPort: 5432
          # TODO: Gebruik secrets voor de database credentials
          env:
            - name: POSTGRES_DB
              value: storingsmelder
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
